name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is load-bearing for the ratchets: the OO, coupling, and
      # suppression checks all resolve a merge-base and read the base-commit
      # baseline blob; a shallow clone has neither the base commit nor HEAD~1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # quarry-0u2t: this check used to run only in release.yml's tag-triggered
      # mcpb job, where it is structurally unsatisfiable — install.sh's VERSION
      # line changes on punt-kit's release-bump commit (phase 2, branch
      # release/vX.Y.Z), but the README's pinned SHA only catches up in a LATER,
      # separate post-release PR (phase 9) that lands after the tag. Running it
      # here, on every regular PR, is where install.sh and the README pin are
      # actually expected to agree.
      #
      # The lone, deliberate exception is the release-bump PR itself (head
      # branch release/vX.Y.Z): that PR's only change to install.sh IS the
      # version bump, and the corresponding README pin update is a separate,
      # later PR by design (punt-kit phase 9, branch post-release/vX.Y.Z) — so
      # this check would always and correctly fail there, for a reason that
      # is not a bug. This is NOT a general "skip on release branches" rule:
      # post-release/vX.Y.Z PRs (phase 9) restore README/install.sh sync and
      # MUST still run this check — that pass is the actual proof the
      # propagation step worked, and a regression there is a real bug.
      #
      # The skip match is exact (release/vX.Y.Z, e.g. release/v3.0.4), not a
      # prefix match — GHA's `if:` expression syntax has no native regex, so
      # the exact-match gate runs shell-side. A loose prefix match (e.g.
      # startsWith(head_ref, "release/v")) would also skip this
      # supply-chain-relevant check for any contributor branch merely named
      # "release/v*" (e.g. release/vnext-experiment), which is not punt-kit's
      # automated release flow and is not the narrow exception this skip
      # exists for.
      - name: Verify README install URL is not stale
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$GH_EVENT_NAME" = "pull_request" ] && [[ "$GH_HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping: $GH_HEAD_REF is punt-kit's release-bump branch — install.sh legitimately changes here before the README pin catches up in the later post-release PR."
            exit 0
          fi
          ./scripts/check-readme-install-sha.sh
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/ tests/
      # pyright is part of local `make type`/`make check` (PL-TC-3) but was
      # absent from CI — that gap let a dependency bump merge green while
      # breaking `make check` locally (reportDeprecated). Run both checkers in
      # CI so a type regression cannot slip through on either one. Force the
      # node-pyright binary to the uv.lock-pinned wrapper version — the same pin
      # `make type` uses — so local and CI always run the identical checker.
      - run: PYRIGHT_PYTHON_FORCE_VERSION=$(uv run python -c "import importlib.metadata as m; print(m.version('pyright'))") uv run pyright src/ tests/
      # DES-031 I1: a client module importing an engine package fails CI here,
      # not in review. Static contract over the import graph (import-linter).
      - name: Import boundary (client/engine)
        run: make check-imports
      # Completeness guard: every scored file must be recorded in the committed
      # baseline. Runs on the committed, post-update-oo state where code and
      # baseline are in sync — see the audit-oo comment in the Makefile.
      - name: OO baseline completeness
        run: make audit-oo
      # PR event: score code-at-HEAD against the baseline committed at the
      # merge-base (the whole PR range). --require-base AND the explicit fetch are
      # both mandatory — with either missing, an unfetched/unresolvable base would
      # fail open and let a regression pass.
      - name: Ratchets (PR — merge-base compare)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          if [ -z "${BASE}" ]; then
            echo "FATAL: cannot resolve merge-base with origin/${{ github.base_ref }}" >&2
            exit 1
          fi
          make check-oo OO_BASE="--base-ref ${BASE} --require-base"
          make check-coupling COUPLING_BASE="--base-ref ${BASE} --require-base"
          make check-suppressions SUPPRESSION_BASE="--base-ref ${BASE} --require-base"
      # push:[main] after a merge: HEAD~1 is the squash's merge-base, so the
      # ratchets re-run on merged reality — the tripwire that catches a red main
      # from a bad squash or a direct push.
      - name: Ratchets (main — post-merge tripwire)
        if: github.event_name == 'push'
        run: |
          make check-oo OO_BASE="--base-ref HEAD~1 --require-base"
          make check-coupling COUPLING_BASE="--base-ref HEAD~1 --require-base --tripwire"
          make check-suppressions SUPPRESSION_BASE="--base-ref HEAD~1 --require-base"
